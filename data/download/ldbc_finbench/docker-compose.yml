services:
  finbench-datagen:
    build: .
    image: finbench-data
    container_name: koumudi-finbench-data
    environment:
      SCALE_FACTOR: ${SCALE_FACTOR}
      GENERATE_PARAMS: ${GENERATE_PARAMS}
    volumes:
      - ./datagen:/home/user/ldbc_finbench
      - ${DATA_DIRECTORY}/finbench:/home/user/data # host path : container path
      - ./post_process:/home/user/scripts
      - ${DATA_DIRECTORY}/params/finbench/sf_${SCALE_FACTOR}/sf${SCALE_FACTOR}_read_params:/home/user/params
    working_dir: /home/user
    tty: true
    stdin_open: true
